# Required Codemagic environment variable groups / secrets:
#
# firebase_credentials:
#   FIREBASE_OPTIONS_BASE64  — base64 of lib/firebase_options.dart
#   GOOGLE_SERVICES_JSON_BASE64 — base64 of android/app/google-services.json
#                               (must use package app.lapis.todo; run `flutterfire configure`)
#   FIREBASE_TOKEN (optional) — CI token for `firebase deploy` of security rules
#
# android_signing:
#   CM_KEYSTORE — base64-encoded upload-keystore.jks
#   CM_KEYSTORE_PASSWORD
#   CM_KEY_PASSWORD
#   CM_KEY_ALIAS

workflows:
  android-release:
    name: Android Release (P0)
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: '*'
          include: false
    environment:
      groups:
        - firebase_credentials
        - android_signing
      vars:
        REQUIRE_RELEASE_KEYSTORE: "true"
      flutter: stable
    scripts:
      - name: Decode Firebase Dart options
        script: |
          echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Decode google-services.json
        script: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is required for app.lapis.todo"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Configure Android release signing
        script: |
          if [ -z "$CM_KEYSTORE" ]; then
            echo "CM_KEYSTORE secret is required for release builds"
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/upload-keystore.jks
          EOF

      - name: Install dependencies
        script: flutter pub get

      - name: Analyze
        script: flutter analyze lib

      - name: Run unit tests
        script: flutter test

      - name: Deploy Firebase security rules (optional)
        script: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npm install -g firebase-tools
            firebase deploy --only firestore:rules,firestore:indexes \
              --token "$FIREBASE_TOKEN" \
              --non-interactive
          else
            echo "FIREBASE_TOKEN not set — skipping rules deploy (run scripts/deploy_firebase_rules locally)"
          fi

      - name: Build Android App Bundle (release)
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab

  android-workflow:
    name: Android Debug (local parity)
    environment:
      groups:
        - firebase_credentials
      flutter: stable
    scripts:
      - name: Decode Firebase config
        script: |
          echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart
      - name: Decode google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build Android debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

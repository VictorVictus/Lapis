name: ci

on:
  push:
    branches: [main, develop, feat/** , fix/** , release/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    branches: [main, develop]

jobs:
  analyze:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: /opt/flutter
          key: flutter-linux-stable
      - name: Install Flutter
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          URL=$(curl -sL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | python3 -c "import json,sys;d=json.load(sys.stdin);r=[r for r in d['releases'] if r['channel']=='stable'][0];print('https://storage.googleapis.com/flutter_infra_release/releases/'+r['archive'])")
          curl -sL "$URL" | tar -xJ -C /opt
      - run: echo "/opt/flutter/bin" >> $GITHUB_PATH
      - run: flutter pub get
      - name: Generate Firebase options stub
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: '', appId: '', messagingSenderId: '', projectId: '',
            );
          }
          EOF
      - run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: /opt/flutter
          key: flutter-linux-stable
      - name: Install Flutter
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          URL=$(curl -sL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | python3 -c "import json,sys;d=json.load(sys.stdin);r=[r for r in d['releases'] if r['channel']=='stable'][0];print('https://storage.googleapis.com/flutter_infra_release/releases/'+r['archive'])")
          curl -sL "$URL" | tar -xJ -C /opt
      - run: echo "/opt/flutter/bin" >> $GITHUB_PATH
      - run: flutter pub get
      - run: flutter test

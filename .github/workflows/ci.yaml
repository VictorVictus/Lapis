name: ci

on:
  push:
    branches: [main, develop, feat/** , fix/** , release/**]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cirruslabs/flutter-action@v2
      - run: flutter pub get
      - run: flutter analyze lib

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cirruslabs/flutter-action@v2
      - run: flutter pub get
      - run: flutter test

name: stale

on:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days. Please comment or it will
            be closed in 14 days.
          stale-pr-message: >
            This PR has been inactive for 60 days. Please comment or it will
            be closed in 14 days.
          close-issue-message: Closed due to inactivity.
          close-pr-message: Closed due to inactivity.

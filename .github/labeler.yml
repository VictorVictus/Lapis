ui:
  - any-glob-to-any-file:
    - lib/widgets/**/*
    - lib/theme/**/*

screens:
  - any-glob-to-any-file:
    - lib/screens/**/*

providers:
  - any-glob-to-any-file:
    - lib/providers/**/*

models:
  - any-glob-to-any-file:
    - lib/models/**/*

backend:
  - any-glob-to-any-file:
    - lib/services/**/*
    - functions/**/*
    - firestore.rules
    - firestore.indexes.json
    - storage.rules

deps:
  - any-glob-to-any-file:
    - pubspec.yaml
    - pubspec.lock
    - functions/package.json
    - functions/package-lock.json

ci:
  - any-glob-to-any-file:
    - .github/**/*
    - codemagic.yaml

docs:
  - any-glob-to-any-file:
    - '**/*.md'
